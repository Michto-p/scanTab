<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#164f91">
  <meta name="description" content="Photographier, découper et lire un tableau électrique directement sur le téléphone, même hors ligne.">
  <!-- Les connexions HTTP(S) au PC sont contrôlées par le module de liaison locale. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' https: http:; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/tableau.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/tableau-192.png">
  <link rel="stylesheet" href="./interface/style.css">
  <title>Scan Tableau · Analyse hors ligne</title>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./" aria-label="Scan Tableau, accueil"><img src="./icons/tableau.svg" alt="" width="40" height="40"><span>Scan Tableau<small>Analyse hors ligne</small></span></a>
    <span id="offline-status" class="offline-status" role="status">Préparation hors ligne avec OCR (17 Mo)…</span>
  </header>
  <main>
    <noscript>Activez JavaScript pour traiter les photos localement sur cet appareil.</noscript>
    <section id="analysis-progress" class="analysis-progress" aria-label="Analyse sur cet appareil" hidden><p id="analysis-status" role="status" aria-live="polite">Préparation de l’analyse locale…</p><progress id="analysis-meter" max="1" value="0" aria-label="Progression de l’analyse"></progress><button id="analysis-cancel">Arrêter l’analyse</button></section>
    <section id="workspace"><h1>Analyser un tableau</h1><p>Ouverture des outils locaux…</p></section>
    <section id="pc-panel" aria-label="Liaison avec le PC"></section>
  </main>
  <footer><span>Vos photos restent sur cet appareil.</span><span id="app-version">Version du 27 novembre 2026</span></footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
